name: pushx_flutter
description: Self-hosted Android push reception, durable inbox, acknowledgements and local notifications.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  centrifuge: 0.20.1
  flutter_foreground_task: 11.0.3
  flutter_local_notifications: 21.0.0
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  path: ^1.9.1
  sqflite: ^2.4.2
  # 2.5.0's JNI coroutine descriptors break in the tested R8 Release build.
  # Keep the channel-based version until an upgraded version passes device QA.
  shared_preferences_android: 2.4.28
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7
